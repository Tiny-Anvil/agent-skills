name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyyaml
      - run: bash scripts/validate.sh
      # Every workflow template, as it would run in an app repo (placeholders are quoted, so they parse).
      - name: actionlint on workflow templates
        run: |
          mapfile -t files < <(git ls-files 'plugins/*/templates/*.yml' | xargs grep -l '^jobs:')
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color "${files[@]}" .github/workflows/validate.yml
