# .github/workflows/security.yml — vulnerable dependencies, CodeQL and Trivy through the shared workflow.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories appear for code that did not change
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # CodeQL results
  actions: read            # CodeQL on private repos

jobs:
  security:
    uses: Tiny-Anvil/workflows/.github/workflows/security.yml@v1
